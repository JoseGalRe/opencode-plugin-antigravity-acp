# Checks every push and pull request with the same gate a change needs
# locally (`pnpm ready`: vp check and every test) and builds the plugin.
# It publishes nothing: releases stay `pnpm release` (AGENTS.md).
#
# Runs on the self-hosted runner labelled `linux` (host mode on AGAMOTTO),
# with the Node and pnpm installed there; pnpm downloads the Node version
# package.json's `engines.runtime` names when the local one does not match.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  ready:
    runs-on: linux
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: node --version && pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm ready
      - run: pnpm build
