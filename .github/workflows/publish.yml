# Publishes @josegalre/opencode-plugin-antigravity-acp to npm when a `v<version>` tag is pushed to GitHub, with npm
# trusted publishing: an OIDC token from this workflow instead of a stored npm token, and provenance generated by
# npm. The package's trusted publisher on npmjs.com must name this repository and this file (`publish.yml`).
# Then it creates or updates the GitHub release of the tag like `pnpm release` does on Gitea: the CHANGELOG.md
# section as notes and the published dist/index.js attached as `opencode-plugin-antigravity-acp-<version>.js`.
#
# The Gitea mirror reads this file too and gets the same tags from `pnpm release`, which already made its release. npm
# trusts only GitHub's OIDC, so publishing runs on GitHub only; on Gitea the `ready` job checks the tag with the same
# gate instead, on the self-hosted runner labelled `linux`. A version already on npm (published by hand) is skipped,
# not failed.
name: Publish

on:
  push:
    tags: ['v*']

# Each job asks for what it needs.
permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  ready:
    if: github.server_url != 'https://github.com'
    runs-on: linux
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 12.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ready
      - run: pnpm build

  publish:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Lets the job ask GitHub for the OIDC token npm accepts instead of a token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 12.22.0
      # No dependency cache in a release build: what is published is built from a clean install.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check that the tag is the package's version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($version)" >&2
            exit 1
          fi
      # setup-node's npmrc holds a placeholder token that fails anonymous reads, so the lookup leaves it out. Only a
      # 404 means "not published"; any other failure stops the job instead of trying to publish.
      - name: Check whether npm already has this version
        id: published
        run: |
          spec="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          if found="$(npm view --userconfig=/dev/null "$spec" version 2>"$RUNNER_TEMP/npm-view.err")" && [ -n "$found" ]; then
            echo "$spec is already on npm: nothing to publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$found" ] && ! [ -s "$RUNNER_TEMP/npm-view.err" ] || grep -q "E404" "$RUNNER_TEMP/npm-view.err"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/npm-view.err" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm ready
      - run: pnpm build
      # Trusted publishing needs npm 11.5.1 or later; Node 26 ships a newer one.
      - run: npm --version
      - if: steps.published.outputs.exists == 'false'
        run: npm publish
      # The release attaches this very build, the one npm got.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: dist/index.js
          if-no-files-found: error
          retention-days: 1

  release:
    needs: publish
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Creates the release and uploads its file; nothing else.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin
          path: artifact
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          asset="$(node scripts/release-notes.ts notes.md)"
          cp artifact/index.js "$asset"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" "$asset" --clobber
