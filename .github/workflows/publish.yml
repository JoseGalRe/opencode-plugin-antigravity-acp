# Publishes @josegalre/opencode-plugin-antigravity-acp to npm when a `v<version>` tag is pushed to GitHub, with npm
# trusted publishing: an OIDC token from this workflow instead of a stored npm token, and provenance generated by
# npm. The package's trusted publisher on npmjs.com must name this repository and this file (`publish.yml`).
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Lets the job ask GitHub for the OIDC token npm accepts instead of a token.
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 12.22.0
      # No dependency cache in a release build: what is published is built from a clean install.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check that the tag is the package's version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($version)" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm ready
      - run: pnpm build
      # Trusted publishing needs npm 11.5.1 or later; Node 26 ships a newer one.
      - run: npm --version
      - run: npm publish
