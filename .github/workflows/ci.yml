# Checks every push to main and every pull request with the same gate a change needs locally (`pnpm ready`: vp check
# and every test) and builds the plugin. It publishes nothing: publish.yml does.
#
# GitHub and the Gitea mirror both run this file: Gitea reads `.github/workflows` when the repository has no
# `.gitea/workflows`. On GitHub the job runs on `ubuntu-latest`; on Gitea, on the self-hosted runner labelled `linux`
# (host mode on AGAMOTTO), where setup-node keeps Node in the runner's tool cache.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ready:
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'linux' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 12.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ready
      - run: pnpm build
